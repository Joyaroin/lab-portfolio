# Adham runs this to deploy to production. It points the production branch at one commit, so
# production gets that commit's chart and image together, and nothing else can change it.
# An older version is how you roll back.
name: promote
on:
  workflow_dispatch:
    inputs:
      version:
        description: A release version (2026.11.20.1) or a commit sha (7 to 40 hex characters). Leave empty for what's on staging.
        required: false
jobs:
  production:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: main
      # Production runs the image by its digest, with the release version as a comment (scripts/deploy-image.mjs).
      - name: Move the production branch
        env:
          INPUT_VERSION: ${{ inputs.version }}
          IMAGE: git.tailf69bc5.ts.net/projects/lab
          REG_USER: adham
          # Read only here: it asks the registry for the image's digest.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          # Copied aside first: the commit being deployed may predate the script.
          cp scripts/deploy-image.mjs "$RUNNER_TEMP/deploy-image.mjs"
          # It refuses anything but empty, a commit sha or a release version before git or the registry sees it, and fails
          # if the image is gone from the registry.
          out=$(node "$RUNNER_TEMP/deploy-image.mjs" resolve "$INPUT_VERSION")
          read -r sha digest version <<< "$out"
          git checkout --detach "$sha"
          node "$RUNNER_TEMP/deploy-image.mjs" write deploy/values-production.yaml "$sha" "$digest" "$version"
          git config user.name forgejo-ci
          git config user.email ci@forgejo.local
          git commit -am "Deploy $sha${version:+ ($version)} to production"
          git push --force origin HEAD:refs/heads/production
