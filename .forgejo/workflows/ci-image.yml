# Builds ci/Dockerfile, the container release.yml's browser jobs run in, and pushes it as projects/lab-ci:pw-<Playwright version>.
# Started by hand (Forgejo's "Run workflow") after a change to ci/Dockerfile or to PLAYWRIGHT_VERSION below, on main or on the PR's
# branch, since it builds the commit it was started on (so a PR can try its image in a release run on its branch); then point
# release.yml's two container tags at the new one. Use a new tag rather than pushing the same one again: the runner keeps
# the copy it already pulled and doesn't look for a newer one.
# The kaniko job can't run the runner gate (no node, no checkout), so the gate job runs it first, as in release.yml. It gates
# like a CI job (mode ci-image): it waits for a release that started before it, and a release started after it waits for the build.
name: ci-image
on:
  workflow_dispatch:
jobs:
  gate:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner gate
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB: gate
        run: node scripts/runner-gate.mjs ci-image
  image:
    needs: gate
    runs-on: docker
    container:
      image: ghcr.io/osscontainertools/kaniko:v1.29.0-debug
    env:
      # Keep it equal to @playwright/test in package-lock.json. A job whose image is behind downloads the browser itself.
      PLAYWRIGHT_VERSION: "1.64.1"
    steps:
      - name: Build and push
        env:
          GIT_USERNAME: forgejo
          GIT_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          # The job's own token can't push packages. This org secret can.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          host=git.tailf69bc5.ts.net
          mkdir -p /kaniko/.docker
          auth=$(printf 'adham:%s' "$REGISTRY_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$host" "$auth" > /kaniko/.docker/config.json
          /kaniko/executor \
            --context "git://$host/$REPO.git#$REF#$SHA" \
            --context-sub-path ci \
            --build-arg "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" \
            --destination "$host/projects/lab-ci:pw-$PLAYWRIGHT_VERSION"
