# Runs on every branch except staging and production, including main after each merge. A PR needs every job green before it merges.
# No browser specs run here (#352): release.yml runs the release specs (@timing, @render) before staging moves and the light specs after it,
# and a builder runs the light specs it touched in its own session. The runner takes 3 jobs at a time (adham/core-infra#5), but a release job must run alone
# (#361), so every job here starts with the runner gate (scripts/runner-gate.mjs, right after checkout, since the script is in the repo; ci-image, a
# reusable workflow with no steps of its own, needs the gate job instead): it waits while a
# release.yml job that started before it is running (a release job that starts later waits for this job instead, so the two can't deadlock). Waiting
# holds a runner slot and uses no CPU; it gives up and fails the job after 60 minutes.
# On main there is no open PR, so the steps that post to a PR log "nothing to post" and pass, except the failure reports: those are added to the standing "CI failures on main" issue.
name: ci
on:
  push:
    branches-ignore: [staging, production]
  workflow_dispatch:
jobs:
  frontend:
    runs-on: docker
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        with:
          persist-credentials: false
      # The runner gate (#361): see the comment at the top of this file.
      - name: Runner gate
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB: frontend
        run: node scripts/runner-gate.mjs ci
      - name: Run make frontend
        id: run
        run: |
          set -o pipefail
          make frontend 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Flags unit tests over 1000 ms as ::warning:: annotations (#416), from the JSON report `make frontend` writes. It only
      # warns: it never fails the job, and a missing report is logged.
      - name: Slow unit tests
        if: always()
        continue-on-error: true
        run: node scripts/slow-tests.mjs test-results/vitest.json
      # Forgejo has no job-log API, so put the failure on the PR. Best effort: it never changes
      # the job result, and a failed post is only logged.
      - name: Post the failure on the PR
        if: failure()
        continue-on-error: true
        env:
          JOB: frontend
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: make frontend
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
  facts:
    runs-on: docker
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        with:
          persist-credentials: false
      # The runner gate (#361): see the comment at the top of this file.
      - name: Runner gate
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB: facts
        run: node scripts/runner-gate.mjs ci
      - name: Run make facts
        id: run
        run: |
          set -o pipefail
          make facts 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Forgejo has no job-log API, so put the failure on the PR. Best effort: it never changes
      # the job result, and a failed post is only logged.
      - name: Post the failure on the PR
        if: failure()
        continue-on-error: true
        env:
          JOB: facts
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: make facts
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
  backend:
    runs-on: docker
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        with:
          persist-credentials: false
      # The runner gate (#361): see the comment at the top of this file.
      - name: Runner gate
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB: backend
        run: node scripts/runner-gate.mjs ci
      - name: Run make backend
        id: run
        run: |
          set -o pipefail
          make backend 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Forgejo has no job-log API, so put the failure on the PR. Best effort: it never changes
      # the job result, and a failed post is only logged.
      - name: Post the failure on the PR
        if: failure()
        continue-on-error: true
        env:
          JOB: backend
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: make backend
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
  integration:
    runs-on: docker
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        with:
          persist-credentials: false
      # The runner gate (#361): see the comment at the top of this file.
      - name: Runner gate
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB: integration
        run: node scripts/runner-gate.mjs ci
      - name: Run make integration
        id: run
        run: |
          set -o pipefail
          make integration 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Forgejo has no job-log API, so put the failure on the PR. Best effort: it never changes
      # the job result, and a failed post is only logged.
      - name: Post the failure on the PR
        if: failure()
        continue-on-error: true
        env:
          JOB: integration
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: make integration
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
  # Runs the runner gate for ci-image, whose build job runs in the kaniko container (no node), so it can't run the gate itself:
  # the same arrangement as release.yml's gate job.
  gate:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The runner gate (#361): see the comment at the top of this file.
      - name: Runner gate
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB: gate
        run: node scripts/runner-gate.mjs ci
  # The CI image (ci/Dockerfile) the screenshots job runs in: adham/ci's build-ci-image, the same call as release.yml's ci-image job.
  # It only asks the registry, unless this branch changed ci/: then it builds a tag of its own, which can't replace main's.
  # The job's own token can't read the org's packages, so the org secret pulls (adham/ci phase 3).
  ci-image:
    needs: gate
    uses: adham/ci/.forgejo/workflows/build-ci-image.yml@v3.0.1
    with:
      image: git.tailf69bc5.ts.net/projects/lab-ci
      context: ci
      registry-user: adham
    # It reads REGISTRY_TOKEN, which only `secrets: inherit` passes (adham/ci ADR 0007).
    secrets: inherit
  # Takes every station at desktop and phone size and puts them on the branch's open PR,
  # replacing the last push's comment. With no open PR it passes and attaches nothing. A shot that
  # can't be taken, or can't be attached, fails the job.
  screenshots:
    needs: ci-image
    runs-on: docker
    # Chromium, Mesa's llvmpipe and Xvfb come installed: the same CI image as release.yml's browser jobs, so the screenshots
    # draw with the same Chromium and Mesa as the release specs. It is pulled even when there's no open PR: after the first
    # pull it's on the runner's disk.
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: adham
        password: ${{ secrets.REGISTRY_TOKEN }}
    # Two quick pushes would race on the PR's screenshot comment and images: the newer run wins.
    concurrency:
      group: screenshots-${{ github.ref }}
      cancel-in-progress: true
    env:
      # WebGL draws on Mesa's llvmpipe under Xvfb, not SwiftShader: measured on the runner, a third of the CPU at the same
      # frame rate. 4 render threads per browser (2 halved the frame rate). The runner takes 3 jobs at a time (adham/core-infra#5). Same setup as release.yml's browser jobs.
      LAB_WEBGL: llvmpipe
      LIBGL_ALWAYS_SOFTWARE: "1"
      LP_NUM_THREADS: "4"
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        with:
          persist-credentials: false
      # The runner gate (#361): see the comment at the top of this file.
      - name: Runner gate
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB: screenshots
        run: node scripts/runner-gate.mjs ci
      - name: Find the open PR
        id: pr
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-screenshots.mjs find
      - name: Take the screenshots
        id: run
        if: steps.pr.outputs.pr != ''
        env:
          SHOTS_DIR: ${{ runner.temp }}/shots
        run: |
          set -o pipefail
          { npm ci && npx playwright install chromium && xvfb-run -a -s "-screen 0 1920x1080x24" npx playwright test -c playwright.screenshots.config.ts --reporter=list; } 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      - name: Attach them to the PR
        id: post
        if: steps.pr.outputs.pr != ''
        env:
          PR: ${{ steps.pr.outputs.pr }}
          SHOTS_DIR: ${{ runner.temp }}/shots
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-screenshots.mjs post
      # Forgejo has no job-log API, so put the failure on the PR. Best effort: it never changes
      # the job result, and a failed post is only logged.
      - name: Post the failure on the PR
        if: failure()
        continue-on-error: true
        env:
          JOB: screenshots
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} pr=${{ steps.pr.outcome }} run=${{ steps.run.outcome }} post=${{ steps.post.outcome }}
          RUN_STEP: run
          CMD: npx playwright test -c playwright.screenshots.config.ts
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
  secret-scan:
    runs-on: docker
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      # The runner gate (#361): see the comment at the top of this file.
      - name: Runner gate
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB: secret-scan
        run: node scripts/runner-gate.mjs ci
      # gitleaks over the full history, pinned by version and SHA-256: adham/ci's secret-scan action. A download or
      # checksum failure inside it shows as this step failing; a finding also writes the redacted report.
      - name: Scan the full history
        id: scan
        uses: https://git.tailf69bc5.ts.net/adham/ci/actions/secret-scan@v3.0.1
      # Forgejo has no job-log API, so put the failure on the PR. Best effort: it never changes
      # the job result, and a failed post is only logged. No log tail: only the redacted report.
      - name: Post the failure on the PR
        if: failure()
        continue-on-error: true
        env:
          JOB: secret-scan
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} scan=${{ steps.scan.outcome }}
          RUN_STEP: scan
          CMD: gitleaks git
          START_FILE: ${{ runner.temp }}/start
          LEAKS_REPORT: ${{ steps.scan.outputs.report }}
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
