# A release is started by hand on main (#355): Forgejo's "Run workflow" on main, or POST /repos/projects/lab/actions/workflows/release.yml/dispatches
# with {"ref": "main"}. A merge to main doesn't start one. A release builds the image and runs the release specs (@timing and @render: make browser-release), then deploys
# to staging: the staging job writes the tag into deploy/values-staging.yaml on the staging branch, the way promote does for production.
# Staging moves only when both pass, so it never gets a commit whose release specs failed. Once staging has moved, the
# browser-light job runs the light specs on main (make browser-light); staging doesn't wait for it, and a red run is
# reported on "CI failures on main". PR CI (ci.yml) runs no browser specs (#352), so this is the only place they run. The runner takes
# 3 jobs at a time (adham/core-infra#5), but a release job must run alone (#361): the gate, browser, staging and browser-light jobs start with the runner gate
# (scripts/runner-gate.mjs, right after checkout, since the script is in the repo), which waits until no job is running that started before it and isn't
# in this run. Jobs that started later are ignored, and ci.yml's jobs wait for a release job that started before them, so the two can't deadlock. The image job runs in
# the kaniko container, which has no node and no checkout, so it can't run the gate: the gate job runs it first, and image and ci-image (adham/ci's build-ci-image, whose build runs in kaniko too) need that job; browser needs ci-image.
# Within a run, image and browser still run at the same time, since a run's own jobs don't block each other. Time spent waiting in the gate counts toward
# the release clock, and the gate's log line says how long it waited.
# The browser and browser-light jobs run in the CI image (ci/Dockerfile), so they install no browser, Mesa or Xvfb. The ci-image job builds
# it, in the release run so it runs alone like the rest, and only when the registry doesn't have its tag yet: a hash of ci/. Both jobs take the
# image name from the ci-image job's output, so no tag is written here.
# Nothing here pushes to main, so a deploy adds no commit there. The staging job pushes only when the run's commit is main's tip, so a run
# started on another branch can't move staging. Run it again by hand to try again after a flaky failure: Forgejo can't re-run one job.
# The release clock runs from the run's start to the end of the staging push. When staging moved, the browser job retried
# no test and the clock is over 360 s, the staging job warns on the standing "Browser job times" issue (scripts/release-clock.mjs).
# That step is best effort and never blocks staging. When the staging job skips its push because main has moved past the commit, the run still
# passes, but the job logs a ::warning:: and comments on "CI failures on main" that staging didn't move, which commit it still runs and that a
# new release is needed (scripts/staging-skipped.mjs; also best effort).
name: release
on:
  workflow_dispatch:
jobs:
  # Waits until no job that started before the release is running (scripts/runner-gate.mjs), then lets image and ci-image start. The browser job
  # gates again: a CI job can start in the seconds between this job ending and browser starting.
  gate:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The runner gate (#361): see the comment at the top of this file.
      - name: Runner gate
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB: gate
        run: node scripts/runner-gate.mjs release
  image:
    needs: gate
    runs-on: docker
    # Start time (epoch seconds), for the release clock when the runs API can't be read.
    outputs:
      start: ${{ steps.start.outputs.start }}
    container:
      image: ghcr.io/osscontainertools/kaniko:v1.29.0-debug
    steps:
      - name: Record start time
        id: start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        env:
          GIT_USERNAME: forgejo
          GIT_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # The job's own token can't push packages. This org secret can.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          host=git.tailf69bc5.ts.net
          mkdir -p /kaniko/.docker
          auth=$(printf 'adham:%s' "$REGISTRY_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$host" "$auth" > /kaniko/.docker/config.json
          /kaniko/executor \
            --context "git://$host/$REPO.git#refs/heads/main#$SHA" \
            --destination "$host/$REPO:$SHA"
  # Builds the CI image (ci/Dockerfile) when the registry doesn't have its tag, and does nothing else: a release whose ci/ hasn't
  # changed only asks the registry. adham/ci's build-ci-image does it: the tag is ci- and a hash of the files in ci/, so a branch with
  # a changed Dockerfile pushes a tag of its own and can't replace main's, and the image output names it for the browser jobs. Its
  # build job runs in the kaniko container, so the gate job gates this one. The job's own token can't read the org's packages: the
  # org secret can (adham/ci phase 3).
  ci-image:
    needs: gate
    uses: adham/ci/.forgejo/workflows/build-ci-image.yml@v3.0.0
    with:
      image: git.tailf69bc5.ts.net/projects/lab-ci
      context: ci
      registry-user: adham
    # It reads REGISTRY_TOKEN, which only `secrets: inherit` passes (adham/ci ADR 0007).
    secrets: inherit
  # The release specs only: @timing and @render.
  browser:
    needs: ci-image
    runs-on: docker
    # Chromium, Mesa's llvmpipe and Xvfb come installed: ci/Dockerfile, built by the ci-image job. The registry is private,
    # so the runner pulls with the org token that pushes images.
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: adham
        password: ${{ secrets.REGISTRY_TOKEN }}
    # start: when the job began (epoch seconds). retried: "true" if any test ran more than once, "false" if none did, empty if
    # the report couldn't be read. load: the load average when the tests ended. All three feed the staging job's clock warning.
    outputs:
      start: ${{ steps.start.outputs.start }}
      retried: ${{ steps.facts.outputs.retried }}
      load: ${{ steps.facts.outputs.load }}
    env:
      # The Makefile installs the browser only when CI is set, so don't leave it to the runner.
      CI: "true"
      # WebGL draws on Mesa's llvmpipe under Xvfb, not SwiftShader: measured on the runner, a third of the CPU at the same
      # frame rate. 4 render threads per browser (2 halved the frame rate). The runner takes 3 jobs at a time (adham/core-infra#5); at 2 jobs, release runs 526 and 527
      # overlapped and took 859 s and 795 s, against about 450 s alone. tests/webgl.spec.ts fails the job if Chromium falls back
      # to SwiftShader, which it does without a display.
      LAB_WEBGL: llvmpipe
      LIBGL_ALWAYS_SOFTWARE: "1"
      LP_NUM_THREADS: "4"
    steps:
      - name: Record start time
        id: start
        run: |
          date +%s > "${{ runner.temp }}/start"
          echo "start=$(cat "${{ runner.temp }}/start")" >> "$GITHUB_OUTPUT"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        with:
          persist-credentials: false
      # The runner gate (#361): see the comment at the top of this file.
      - name: Runner gate
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB: browser
        run: node scripts/runner-gate.mjs release
      - name: Run make browser-release PW_ARGS="--reporter=list,json"
        id: run
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright.json
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" make browser-release PW_ARGS="--reporter=list,json" 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Best effort: reads the Playwright report for the retried output and the load average. Never changes the job result.
      - name: Record retries and load
        id: facts
        if: always()
        continue-on-error: true
        env:
          REPORT: ${{ runner.temp }}/playwright.json
        run: node scripts/release-clock.mjs retried
      # Forgejo has no job-log API, so post the failure. On main that is a comment on the standing
      # "CI failures on main" issue. Best effort: it never changes the job result, and a failed post is only logged.
      - name: Post the failure
        if: failure()
        continue-on-error: true
        env:
          JOB: browser
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: xvfb-run make browser-release PW_ARGS="--reporter=list,json"
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          REPORT: ${{ runner.temp }}/playwright.json
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
      # What the run cost: its time, load, flaky tests, slowest tests and boot time (scripts/browser-report.mjs). On main only a pass
      # with a flaky test posts anything (a failure's comment above names its flaky tests). It runs after "Post the failure", which
      # the report links. Best effort: it never changes the job result.
      - name: Report the run
        id: report
        if: always()
        continue-on-error: true
        env:
          JOB: browser
          OUTCOME: ${{ steps.run.outcome }}
          START_FILE: ${{ runner.temp }}/start
          REPORT: ${{ runner.temp }}/playwright.json
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/browser-report.mjs
  staging:
    needs: [image, browser]
    runs-on: docker
    # moved: "true" once staging was pushed, "false" when main had moved past this commit.
    outputs:
      moved: ${{ steps.move.outputs.moved }}
    # One staging push at a time. The tip-of-main check below is what stops an older run winning.
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      # The runner gate (#361): see the comment at the top of this file.
      - name: Runner gate
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB: staging
        run: node scripts/runner-gate.mjs release
      - name: Move the staging branch
        id: move
        env:
          SHA: ${{ github.sha }}
        run: |
          # An older run must not overwrite a newer one. Each attempt reads where staging is, checks
          # this commit is still main's tip, then pushes only if staging hasn't moved since the read.
          # A refused push means another run got in between, so look again. At most 3 attempts.
          git config user.name forgejo-ci
          git config user.email ci@forgejo.local
          for attempt in 1 2 3; do
            if git fetch origin staging; then
              seen=$(git rev-parse FETCH_HEAD)
            else
              seen=""   # no staging branch yet: the empty lease means it must not exist
            fi
            git fetch origin main
            if [ "$(git rev-parse FETCH_HEAD)" != "$SHA" ]; then
              echo "::warning::main has moved past $SHA, so this release is out of date. Not pushing: start a new release on main."
              echo "moved=false" >> "$GITHUB_OUTPUT"
              # What staging still runs, for the warning step: the staging branch's head (seen) and the commit its image tag names.
              echo "seen=$seen" >> "$GITHUB_OUTPUT"
              if [ -n "$seen" ]; then
                echo "runs=$(git show "$seen:deploy/values-staging.yaml" | sed -n -E 's/^[[:space:]]*tag:[[:space:]]*"?([0-9a-f]{40})"?.*/\1/p' | head -n 1)" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            git reset --hard "$SHA"
            sed -i -E "s/^(\s*tag:).*/\1 \"$SHA\"/" deploy/values-staging.yaml
            git commit -am "Deploy $SHA to staging"
            if git push --force-with-lease="refs/heads/staging:$seen" origin HEAD:refs/heads/staging; then
              echo "moved=true" >> "$GITHUB_OUTPUT"
              echo "ended=$(date +%s)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $attempt was refused." >&2
          done
          echo "Staging push was refused 3 times." >&2
          exit 1
      # Warns on the "Browser job times" issue when the release took over 360 s with no test retried. Best effort: an API
      # read or post that fails is logged and passes, and nothing here can stop staging.
      - name: Warn when the release was slow
        id: clock
        continue-on-error: true
        env:
          MOVED: ${{ steps.move.outputs.moved }}
          ENDED: ${{ steps.move.outputs.ended }}
          RETRIED: ${{ needs.browser.outputs.retried }}
          BROWSER_START: ${{ needs.browser.outputs.start }}
          IMAGE_START: ${{ needs.image.outputs.start }}
          LOAD: ${{ needs.browser.outputs.load }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-clock.mjs warn
      # When the push was skipped because main had moved past this commit, says so on "CI failures on main": staging didn't move, which
      # commit it still runs, and that a new release is needed (nothing else will move it). The run still passes. Best effort: a post that
      # fails is logged and passes (scripts/staging-skipped.mjs).
      - name: Warn when staging did not move
        id: skipped
        if: steps.move.outputs.moved == 'false'
        continue-on-error: true
        env:
          MOVED: ${{ steps.move.outputs.moved }}
          SEEN: ${{ steps.move.outputs.seen }}
          RUNS: ${{ steps.move.outputs.runs }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/staging-skipped.mjs
  # The light specs on main, after staging has moved, so they don't share the runner with the release specs. Staging doesn't
  # wait for them. A red run is a comment on "CI failures on main", and the report names flaky tests.
  browser-light:
    runs-on: docker
    # ci-image only for its output, the image name: it finished before staging could start.
    needs: [staging, ci-image]
    # Chromium, Mesa's llvmpipe and Xvfb come installed: ci/Dockerfile, built by the ci-image job. The registry is private,
    # so the runner pulls with the org token that pushes images.
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: adham
        password: ${{ secrets.REGISTRY_TOKEN }}
    # Only when staging moved: not when main had moved past this commit (this release is out of date: start a new one on main).
    if: needs.staging.outputs.moved == 'true'
    env:
      # The Makefile installs the browser only when CI is set, so don't leave it to the runner.
      CI: "true"
      # WebGL draws on Mesa's llvmpipe under Xvfb, not SwiftShader: measured on the runner, a third of the CPU at the same
      # frame rate. 4 render threads per browser (2 halved the frame rate). The runner takes 3 jobs at a time (adham/core-infra#5); at 2 jobs, release runs 526 and 527
      # overlapped and took 859 s and 795 s, against about 450 s alone. tests/webgl.spec.ts fails the job if Chromium falls back
      # to SwiftShader, which it does without a display.
      LAB_WEBGL: llvmpipe
      LIBGL_ALWAYS_SOFTWARE: "1"
      LP_NUM_THREADS: "4"
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        id: checkout
        with:
          persist-credentials: false
      # The runner gate (#361): see the comment at the top of this file.
      - name: Runner gate
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB: browser-light
        run: node scripts/runner-gate.mjs release
      - name: Run make browser-light PW_ARGS="--reporter=list,json"
        id: run
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright.json
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" make browser-light PW_ARGS="--reporter=list,json" 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Forgejo has no job-log API, so post the failure. On main that is a comment on the standing
      # "CI failures on main" issue. Best effort: it never changes the job result, and a failed post is only logged.
      - name: Post the failure
        if: failure()
        continue-on-error: true
        env:
          JOB: browser-light
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: xvfb-run make browser-light PW_ARGS="--reporter=list,json"
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          REPORT: ${{ runner.temp }}/playwright.json
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
      # What the run cost: its time, load, flaky tests, slowest tests and boot time (scripts/browser-report.mjs). On main only a pass
      # with a flaky test posts anything (a failure's comment above names its flaky tests). It runs after "Post the failure", which
      # the report links. Best effort: it never changes the job result.
      - name: Report the run
        id: report
        if: always()
        continue-on-error: true
        env:
          JOB: browser-light
          OUTCOME: ${{ steps.run.outcome }}
          START_FILE: ${{ runner.temp }}/start
          REPORT: ${{ runner.temp }}/playwright.json
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/browser-report.mjs
