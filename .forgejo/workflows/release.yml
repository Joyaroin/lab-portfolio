# A merge to main builds the image and runs the release specs (@timing and @render: make browser-release), then deploys
# to staging: the staging job writes the tag into deploy/values-staging.yaml on the staging branch, the way promote does for production.
# Staging moves only when both pass, so it never gets a commit whose release specs failed. Once staging has moved, the
# browser-light job runs the light specs on main (make browser-light); staging doesn't wait for it, and a red run is
# reported on "CI failures on main". The light specs also run on every PR (ci.yml), and so do the screenshots, so neither shares the
# runner with the release specs here. The runner takes 2 jobs at once.
# Nothing here pushes to main, so a deploy adds no commit there and every merge to main runs this.
# Run it by hand on main to try again after a flaky failure: Forgejo can't re-run one job.
# The release clock runs from the run's start to the end of the staging push. When staging moved, the browser job retried
# no test and the clock is over 360 s, the staging job warns on the standing "Browser job times" issue (scripts/release-clock.mjs).
# That step is best effort and never blocks staging.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  image:
    runs-on: docker
    # Start time (epoch seconds), for the release clock when the runs API can't be read.
    outputs:
      start: ${{ steps.start.outputs.start }}
    container:
      image: ghcr.io/osscontainertools/kaniko:v1.29.0-debug
    steps:
      - name: Record start time
        id: start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        env:
          GIT_USERNAME: forgejo
          GIT_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # The job's own token can't push packages. This org secret can.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          host=git.tailf69bc5.ts.net
          mkdir -p /kaniko/.docker
          auth=$(printf 'adham:%s' "$REGISTRY_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$host" "$auth" > /kaniko/.docker/config.json
          /kaniko/executor \
            --context "git://$host/$REPO.git#refs/heads/main#$SHA" \
            --destination "$host/$REPO:$SHA"
  # The release specs only: @timing and @render.
  browser:
    runs-on: docker
    # start: when the job began (epoch seconds). retried: "true" if any test ran more than once, "false" if none did, empty if
    # the report couldn't be read. load: the load average when the tests ended. All three feed the staging job's clock warning.
    outputs:
      start: ${{ steps.start.outputs.start }}
      retried: ${{ steps.facts.outputs.retried }}
      load: ${{ steps.facts.outputs.load }}
    env:
      # The Makefile installs the browser only when CI is set, so don't leave it to the runner.
      CI: "true"
      # WebGL draws on Mesa's llvmpipe under Xvfb, not SwiftShader: measured on the runner, a third of the CPU at the same
      # frame rate. 4 render threads per browser (2 halved the frame rate). The runner takes 2 jobs at once: release runs 526 and 527
      # overlapped and took 859 s and 795 s, against about 450 s alone. tests/webgl.spec.ts fails the job if Chromium falls back
      # to SwiftShader, which it does without a display.
      LAB_WEBGL: llvmpipe
      LIBGL_ALWAYS_SOFTWARE: "1"
      LP_NUM_THREADS: "4"
    steps:
      - name: Record start time
        id: start
        run: |
          date +%s > "${{ runner.temp }}/start"
          echo "start=$(cat "${{ runner.temp }}/start")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      # CI only: Mesa's llvmpipe and the virtual display it draws through.
      - name: Install Mesa and Xvfb
        id: drivers
        run: |
          set -o pipefail
          { apt-get update && apt-get install -y --no-install-recommends libgl1-mesa-dri libegl-mesa0 libgbm1 xvfb xauth; } 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      - name: Run make browser-release PW_ARGS="--reporter=list,json"
        id: run
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright.json
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" make browser-release PW_ARGS="--reporter=list,json" 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Best effort: reads the Playwright report for the retried output and the load average. Never changes the job result.
      - name: Record retries and load
        id: facts
        if: always()
        continue-on-error: true
        env:
          REPORT: ${{ runner.temp }}/playwright.json
        run: node scripts/release-clock.mjs retried
      # Forgejo has no job-log API, so post the failure. On main that is a comment on the standing
      # "CI failures on main" issue. Best effort: it never changes the job result, and a failed post is only logged.
      - name: Post the failure
        if: failure()
        continue-on-error: true
        env:
          JOB: browser
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} drivers=${{ steps.drivers.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: xvfb-run make browser-release PW_ARGS="--reporter=list,json"
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          REPORT: ${{ runner.temp }}/playwright.json
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
      # What the run cost: its time, load, flaky tests, slowest tests and boot time (scripts/browser-report.mjs). On main only a pass
      # with a flaky test posts anything (a failure's comment above names its flaky tests). It runs after "Post the failure", which
      # the report links on a PR. Best effort: it never changes the job result.
      - name: Report the run
        id: report
        if: always()
        continue-on-error: true
        env:
          JOB: browser
          OUTCOME: ${{ steps.run.outcome }}
          START_FILE: ${{ runner.temp }}/start
          REPORT: ${{ runner.temp }}/playwright.json
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/browser-report.mjs
  staging:
    needs: [image, browser]
    runs-on: docker
    # moved: "true" once staging was pushed, "false" when main had moved past this commit.
    outputs:
      moved: ${{ steps.move.outputs.moved }}
    # One staging push at a time. The tip-of-main check below is what stops an older run winning.
    concurrency:
      group: staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Move the staging branch
        id: move
        env:
          SHA: ${{ github.sha }}
        run: |
          # An older run must not overwrite a newer one. Each attempt reads where staging is, checks
          # this commit is still main's tip, then pushes only if staging hasn't moved since the read.
          # A refused push means another run got in between, so look again. At most 3 attempts.
          git config user.name forgejo-ci
          git config user.email ci@forgejo.local
          for attempt in 1 2 3; do
            if git fetch origin staging; then
              seen=$(git rev-parse FETCH_HEAD)
            else
              seen=""   # no staging branch yet: the empty lease means it must not exist
            fi
            git fetch origin main
            if [ "$(git rev-parse FETCH_HEAD)" != "$SHA" ]; then
              echo "main has moved past $SHA, so a newer run owns staging. Not pushing."
              echo "moved=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git reset --hard "$SHA"
            sed -i -E "s/^(\s*tag:).*/\1 \"$SHA\"/" deploy/values-staging.yaml
            git commit -am "Deploy $SHA to staging"
            if git push --force-with-lease="refs/heads/staging:$seen" origin HEAD:refs/heads/staging; then
              echo "moved=true" >> "$GITHUB_OUTPUT"
              echo "ended=$(date +%s)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $attempt was refused." >&2
          done
          echo "Staging push was refused 3 times." >&2
          exit 1
      # Warns on the "Browser job times" issue when the release took over 360 s with no test retried. Best effort: an API
      # read or post that fails is logged and passes, and nothing here can stop staging.
      - name: Warn when the release was slow
        id: clock
        continue-on-error: true
        env:
          MOVED: ${{ steps.move.outputs.moved }}
          ENDED: ${{ steps.move.outputs.ended }}
          RETRIED: ${{ needs.browser.outputs.retried }}
          BROWSER_START: ${{ needs.browser.outputs.start }}
          IMAGE_START: ${{ needs.image.outputs.start }}
          LOAD: ${{ needs.browser.outputs.load }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-clock.mjs warn
  # The light specs on main, after staging has moved, so they don't share the runner with the release specs. Staging doesn't
  # wait for them. A red run is a comment on "CI failures on main", and the report names flaky tests.
  browser-light:
    runs-on: docker
    needs: staging
    # Only when staging moved: not when main had moved past this commit and a newer run owns staging.
    if: needs.staging.outputs.moved == 'true'
    env:
      # The Makefile installs the browser only when CI is set, so don't leave it to the runner.
      CI: "true"
      # WebGL draws on Mesa's llvmpipe under Xvfb, not SwiftShader: measured on the runner, a third of the CPU at the same
      # frame rate. 4 render threads per browser (2 halved the frame rate). The runner takes 2 jobs at once: release runs 526 and 527
      # overlapped and took 859 s and 795 s, against about 450 s alone. tests/webgl.spec.ts fails the job if Chromium falls back
      # to SwiftShader, which it does without a display.
      LAB_WEBGL: llvmpipe
      LIBGL_ALWAYS_SOFTWARE: "1"
      LP_NUM_THREADS: "4"
    steps:
      - name: Record start time
        id: start
        run: date +%s > "${{ runner.temp }}/start"
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      # CI only: Mesa's llvmpipe and the virtual display it draws through.
      - name: Install Mesa and Xvfb
        id: drivers
        run: |
          set -o pipefail
          { apt-get update && apt-get install -y --no-install-recommends libgl1-mesa-dri libegl-mesa0 libgbm1 xvfb xauth; } 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      - name: Run make browser-light PW_ARGS="--reporter=list,json"
        id: run
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright.json
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" make browser-light PW_ARGS="--reporter=list,json" 2>&1 | tee "${{ runner.temp }}/out.log" || { c=$?; echo "$c" > "${{ runner.temp }}/exit"; exit "$c"; }
      # Forgejo has no job-log API, so post the failure. On main that is a comment on the standing
      # "CI failures on main" issue. Best effort: it never changes the job result, and a failed post is only logged.
      - name: Post the failure
        if: failure()
        continue-on-error: true
        env:
          JOB: browser-light
          STEPS: start=${{ steps.start.outcome }} checkout=${{ steps.checkout.outcome }} drivers=${{ steps.drivers.outcome }} run=${{ steps.run.outcome }}
          RUN_STEP: run
          CMD: xvfb-run make browser-light PW_ARGS="--reporter=list,json"
          OUT_FILE: ${{ runner.temp }}/out.log
          EXIT_FILE: ${{ runner.temp }}/exit
          START_FILE: ${{ runner.temp }}/start
          REPORT: ${{ runner.temp }}/playwright.json
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-ci-failure.mjs
      # What the run cost: its time, load, flaky tests, slowest tests and boot time (scripts/browser-report.mjs). On main only a pass
      # with a flaky test posts anything (a failure's comment above names its flaky tests). It runs after "Post the failure", which
      # the report links on a PR. Best effort: it never changes the job result.
      - name: Report the run
        id: report
        if: always()
        continue-on-error: true
        env:
          JOB: browser-light
          OUTCOME: ${{ steps.run.outcome }}
          START_FILE: ${{ runner.temp }}/start
          REPORT: ${{ runner.temp }}/playwright.json
          MASK_ENV: TOKEN
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/browser-report.mjs
